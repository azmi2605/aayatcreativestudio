<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Selected Portfolio Work — Aayat Creative Studio</title>
  <meta name="description" content="Explore selected advertising creatives, custom poster designs, and social media brand identities crafted by Aayat Creative Studio.">
  <link rel="canonical" href="https://aayatcreativestudio.com/work/">
  
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components/buttons.css">
  <link rel="stylesheet" href="/css/components/header-footer.css">
  <style>
    .filter-bar {
      display: flex;
      gap: var(--cs-space-2);
      flex-wrap: wrap;
      margin-bottom: var(--cs-space-7);
      padding-bottom: var(--cs-space-4);
      border-bottom: var(--cs-border-default);
    }
    .filter-btn {
      background: transparent;
      border: 1px solid var(--cs-color-line-strong);
      border-radius: var(--cs-radius-sm);
      padding: var(--cs-space-2) var(--cs-space-4);
      font-size: var(--cs-text-small);
      font-weight: var(--cs-weight-medium);
      color: var(--cs-color-brown);
      cursor: pointer;
      transition: all var(--cs-transition-fast);
    }
    .filter-btn:hover {
      background: var(--cs-color-gold-tint);
    }
    .filter-btn[aria-pressed="true"] {
      background: var(--cs-color-brown);
      color: var(--cs-color-on-brown);
      border-color: var(--cs-color-brown);
    }
    .portfolio-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: var(--cs-space-6);
    }
    @media (min-width: 640px) {
      .portfolio-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
    @media (min-width: 1024px) {
      .portfolio-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }
  </style>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <!-- Public Header (included from /includes/header.html) -->
  <div id="site-header"></div>

  <main id="main-content">
    <section class="section">
      <div class="container">
        <div class="container-reading" style="margin-bottom: var(--cs-space-6);">
          <span class="text-eyebrow">Portfolio</span>
          <h1 style="margin-top: var(--cs-space-2); margin-bottom: var(--cs-space-3);">Selected Work</h1>
          <p class="text-body-lg text-muted">
            A curated showcase of commercial ad campaigns, editorial poster series, and visual identity systems developed for ambitious brands.
          </p>
        </div>

        <!-- Category Filter Bar — buttons are rendered from the shared
             category list the admin portal manages -->
        <nav class="filter-bar" aria-label="Filter portfolio by category">
          <button class="filter-btn" data-category="all" aria-pressed="true">All Projects</button>
        </nav>

        <!-- Live Status / Result Announcement -->
        <div id="filter-status" class="visually-hidden" aria-live="polite"></div>

        <!-- Portfolio Items Grid -->
        <div id="portfolio-container" class="portfolio-grid" aria-live="polite">
          <p class="text-muted">Loading portfolio collection...</p>
        </div>
      </div>
    </section>
  </main>

  <!-- Public Footer (included from /includes/footer.html) -->
  <div id="site-footer"></div>

  <script type="module" src="/js/includes.js"></script>
  <script type="module" src="/js/pages/work.js"></script>
</body>
</html>
