<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studio Portal — Aayat Creative Studio</title>
  <meta name="robots" content="noindex, nofollow, noarchive">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components/buttons.css">
  <style>
    .admin-auth-card {
      max-width: 420px;
      margin: 80px auto;
      padding: var(--cs-space-7);
      background-color: var(--cs-color-surface);
      border: var(--cs-border-default);
      border-radius: var(--cs-radius-sm);
      box-shadow: var(--cs-shadow-dialog);
    }
    .form-group {
      margin-bottom: var(--cs-space-5);
      display: flex;
      flex-direction: column;
      gap: var(--cs-space-2);
    }
    .form-input {
      padding: var(--cs-space-3) var(--cs-space-4);
      border: var(--cs-border-strong);
      border-radius: var(--cs-radius-sm);
      font-size: var(--cs-text-body);
    }
  </style>
</head>
<body style="background-color: var(--cs-color-bg);">
  <main class="container">
    <div class="admin-auth-card">
      <div style="text-align: center; margin-bottom: var(--cs-space-6);">
        <img src="/assets/brand/monogram.png" alt="Aayat Studio" width="48" height="48" style="margin: 0 auto var(--cs-space-3);">
        <h1 style="font-size: 1.75rem;">Studio Portal</h1>
        <p class="text-small text-muted" style="margin-top: var(--cs-space-1);">Admin sign-in for content & enquiries</p>
      </div>

      <div id="login-error" style="display: none; padding: var(--cs-space-3); background-color: var(--cs-color-error-tint); color: var(--cs-color-error); font-size: var(--cs-text-small); border-radius: var(--cs-radius-sm); margin-bottom: var(--cs-space-4);" role="alert">
        Please enter an email and password.
      </div>

      <form id="login-form">
        <div class="form-group">
          <label for="admin-email" class="text-small" style="font-weight: 500;">Email Address</label>
          <input type="email" id="admin-email" class="form-input" required autocomplete="email" placeholder="admin@aayatcreativestudio.com">
        </div>

        <div class="form-group">
          <label for="admin-password" class="text-small" style="font-weight: 500;">Password</label>
          <input type="password" id="admin-password" class="form-input" required autocomplete="current-password" placeholder="••••••••">
        </div>

        <div style="margin-top: var(--cs-space-6);">
          <button type="submit" id="login-btn" class="btn btn-primary" style="width: 100%;">
            Sign In to Portal
          </button>
        </div>

        <div style="margin-top: var(--cs-space-4); text-align: center;">
          <a href="/admin/dashboard.html" id="direct-entry-link" style="font-size: var(--cs-text-small); color: var(--cs-color-ink-muted);">Enter Dashboard Directly &rarr;</a>
        </div>
      </form>
    </div>
  </main>

  <script type="module" src="/js/admin/login.js"></script>
</body>
</html>
